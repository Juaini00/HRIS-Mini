services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nusahr
      POSTGRES_USER: nusahr
      POSTGRES_PASSWORD: nusahr
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nusahr -d nusahr"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres-data:
