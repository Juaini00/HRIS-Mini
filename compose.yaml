services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Makassar
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nusahr
      DB_USERNAME: nusahr
      DB_PASSWORD: nusahr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
  queue:
    build: .
    command: php artisan queue:work --tries=3
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: nusahr
      DB_USERNAME: nusahr
      DB_PASSWORD: nusahr
      QUEUE_CONNECTION: database
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nusahr
      POSTGRES_USER: nusahr
      POSTGRES_PASSWORD: nusahr
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nusahr -d nusahr"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres-data:
